name: DepSherpa
description: >-
  Evidence-first dependency upgrade report. Runs the upgrade in a disposable clone,
  compares the repository's own checks before and after, may propose a bounded repair,
  and stops at a human decision. Never commits, pushes, or writes to the repository.
author: cfngc4594

# This will appear on the GitHub Marketplace.
branding:
  icon: shield
  color: orange

inputs:
  package:
    description: >-
      npm package to upgrade. Leave empty on a pull request to detect the single
      changed dependency from package.json.
    required: false
    default: ''
  version:
    description: >-
      Exact target version (for example 4.1.5). Required together with `package`;
      detected from the pull request otherwise.
    required: false
    default: ''
  attempt-repair:
    description: >-
      Allow a recipe or the configured model to propose a bounded source repair
      that is validated and verified inside the clone.
    required: false
    default: 'true'
  comment:
    description: >-
      Post (or update) one report comment on the pull request. Requires the
      `pull-requests: write` permission.
    required: false
    default: 'true'
  upload-artifact:
    description: Upload report.json, report.md, and candidate.patch as the `depsherpa-report` artifact.
    required: false
    default: 'true'
  fail-on:
    description: >-
      Comma-separated verdicts that fail the workflow step after the report is written
      (for example `needs_repair,blocked`). Empty (default) keeps report-only behavior.
    required: false
    default: ''
  report-dir:
    description: Directory inside the workspace that receives the report files.
    required: false
    default: depsherpa-report
  model:
    description: >-
      Model identifier (required together with `openai-api-key` for model proposals).
      Leave empty to use OPENAI_MODEL or DEPSHERPA_MODEL from the runner environment.
    required: false
    default: ''
  openai-base-url:
    description: >-
      Optional base URL of an OpenAI-compatible endpoint. Leave empty for the official OpenAI API
      or OPENAI_BASE_URL from the runner environment.
    required: false
    default: ''
  openai-api-key:
    description: >-
      API key (required together with `model` for model proposals). Leave empty to run without
      model proposals (recipes still run).
    required: false
    default: ''
  github-token:
    description: >-
      Token used only for the pull request comment; needs the `pull-requests: write`
      permission.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: >-
      ready_for_review, repaired_ready_for_review, needs_repair, inconclusive,
      blocked, or skipped.
  repair-status:
    description: >-
      not_requested, not_needed, unsupported, agent_unavailable, policy_rejected,
      verified, failed_verification, or not_run.
  report-dir:
    description: Directory containing report.json, report.md, and candidate.patch (empty when skipped).
  package:
    description: The npm package that was investigated.
  target-version:
    description: The exact target version that was investigated.

runs:
  using: node24
  main: dist/index.js
